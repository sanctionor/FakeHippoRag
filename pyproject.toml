[tool.poetry]
name = "fake-hippo-rag"
version = "0.1.0"
description = "A modular Retrieval-Augmented Generation pipeline scaffold."
authors = ["Fake Hippo <fake@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
tomli = { version = "^2.0", python = "<3.11" }

[tool.poetry.group.dev.dependencies]
black = "^23.12"
isort = "^5.13"
mypy = "^1.8"
pytest = "^7.4"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict = true
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
